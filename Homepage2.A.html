<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Career Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#001f4d,#0059b3,#00aaff);overflow-x:hidden}
.container{max-width:1400px;margin:auto;padding:60px 30px}
.heading{text-align:center;margin-bottom:60px}
.heading h1{font-size:60px;color:#fff}
.heading p{color:#dbeafe;font-size:20px;margin-top:15px}
.career-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px}
.card{background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:30px;padding:30px;border:1px solid rgba(255,255,255,.2);text-align:center;transition:.3s}
.card:hover{transform:translateY(-10px)}
.circle{width:140px;height:140px;border-radius:50%;background:#fff;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.circle img{width:85px;height:85px;object-fit:contain}
.title{font-size:28px;color:#fff;font-weight:700}
.btn{display:block;margin-top:20px;padding:14px;border-radius:12px;text-decoration:none;background:#009dff;color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="container">

<p>Discover Your Perfect Career Path</p>
</div>

<div class="card"><div class="circle"><img src="https://img.icons8.com/color/96/airplane-take-off.png" alt="Pilot"></div><div class="title">Pilot</div><a class="btn" href="pilot.html">Explore</a></div>
