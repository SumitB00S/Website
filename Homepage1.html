<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Qualification Page</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#eef6ff,#dff1ff);
      overflow:hidden;
      position:relative;
    }

    /* Background Shapes */

    .shape1{
      position:absolute;
      width:450px;
      height:450px;
      background:#0d7be0;
      top:-180px;
      right:-120px;
      border-radius:60px;
      transform:rotate(25deg);
      opacity:0.85;
    }

    .shape2{
      position:absolute;
      width:300px;
      height:300px;
      background:#57ccff;
      bottom:-100px;
      left:-100px;
      border-radius:60px;
      transform:rotate(25deg);
      opacity:0.65;
    }

    /* Main Card */

    .qualification-card{
      width:100%;
      max-width:950px;
      background:rgba(255,255,255,0.96);
      border-radius:30px;
      overflow:hidden;
      display:flex;
      align-items:center;
      box-shadow:0 20px 45px rgba(0,0,0,0.12);
      position:relative;
      z-index:5;
    }

    /* Left Side */

    .left-section{
      width:50%;
      background:linear-gradient(135deg,#0d7be0,#17b5ff);
      color:white;
      padding:60px 40px;
      text-align:center;
    }

    .left-section h1{
      font-size:42px;
      margin-bottom:20px;
      line-height:1.2;
    }

    .left-section p{
      font-size:16px;
      line-height:1.8;
      margin-bottom:30px;
    }

    .left-section img{
      width:100%;
      max-width:350px;
      animation:float 4s ease-in-out infinite;
    }

    @keyframes float{
      0%{transform:translateY(0px);}
      50%{transform:translateY(-12px);}
      100%{transform:translateY(0px);}
    }

    /* Right Side */

    .right-section{
      width:50%;
      padding:55px 45px;
    }

    .title{
      font-size:36px;
      color:#1d2c39;
      margin-bottom:12px;
      font-weight:700;
    }

    .subtitle{
      color:#6d7b88;
      line-height:1.7;
      margin-bottom:35px;
      font-size:15px;
    }

    .input-group{
      margin-bottom:22px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:600;
      color:#243547;
    }

    .input-group select,
    .input-group input{
      width:100%;
      padding:15px 16px;
      border:1px solid #d7e4ef;
      border-radius:14px;
      outline:none;
      font-size:15px;
      transition:0.3s;
    }

    .input-group select:focus,
    .input-group input:focus{
      border-color:#1198ff;
      box-shadow:0 0 0 4px rgba(17,152,255,0.12);
    }

    .continue-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:15px;
      background:linear-gradient(to right,#0d7be0,#17b5ff);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
      box-shadow:0 10px 22px rgba(13,123,224,0.25);
    }

    .continue-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 28px rgba(13,123,224,0.35);
    }

    /* Responsive */

    @media(max-width:900px){

      body{
        padding:20px;
        overflow:auto;
      }

      .qualification-card{
        flex-direction:column;
      }

      .left-section,
      .right-section{
        width:100%;
      }

      .left-section{
        padding:45px 30px;
      }

      .right-section{
        padding:40px 25px;
      }

    }

  </style>
</head>
<body>

  <!-- Background -->

  <div class="shape1"></div>
  <div class="shape2"></div>

  <!-- Main Card -->

  <div class="qualification-card">

    <!-- Left Side -->

    <div class="left-section">

      <h1>🎓 Find Your Best Career</h1>

      <p>
        Tell us about your qualification and we will help you
        discover the best career opportunities for your future.
      </p>

    </div>

    <!-- Right Side -->

    <div class="right-section">

      <h2 class="title">Qualification Details</h2>

      <p class="subtitle">
        Select your education qualification to continue and explore
        suitable courses and career paths.
      </p>

      <form>
        <!-- Age -->

<div class="input-group">
  <label>Age</label>

  <input 
    type="number" 
    placeholder="Enter your age"
    min="1"
    max="100"
  >
</div>

        <!-- Qualification -->

<div class="input-group">
  <label>Select Qualification</label>

  <select>
    <option>Select Qualification</option>

    <option>10th Pass</option>
    <option>12th Pass</option>

    <option>ITI</option>
    <option>Diploma</option>

    <option>B.A</option>
    <option>B.Sc</option>
    <option>B.Com</option>
    <option>BCA</option>
    <option>BBA</option>
    <option>B.Tech</option>
    <option>B.Ed</option>

    <option>M.A</option>
    <option>M.Sc</option>
    <option>M.Com</option>
    <option>MCA</option>
    <option>MBA</option>
    <option>M.Tech</option>

    <option>PhD</option>

    <option>Other</option>
    <option>None</option>

  </select>
</div>

<!-- Stream / Subject -->

<div class="input-group">
  <label>Select Stream / Subject</label>

  <select>
    <option>Select Stream</option>

    <option>Science</option>
    <option>Commerce</option>
    <option>Arts</option>

    <option>Physics</option>
    <option>Chemistry</option>
    <option>Mathematics</option>
    <option>Biology</option>

    <option>Computer Science</option>
    <option>Information Technology</option>

    <option>Mechanical Engineering</option>
    <option>Civil Engineering</option>
    <option>Electrical Engineering</option>
    <option>Electronics Engineering</option>

    <option>Accounting</option>
    <option>Finance</option>
    <option>Economics</option>

    <option>History</option>
    <option>Political Science</option>
    <option>Geography</option>
    <option>English</option>

    <option>Management</option>
    <option>Marketing</option>
    <option>Human Resource</option>

    <option>General</option>
    <option>All Streams</option>
    <option>None</option>
    <option>Other</option>
  </select>
</div>

<!-- Qualifying Year -->

<div class="input-group">
  <label>Qualifying Year</label>

  <select>
    <option>Select Year</option>

    <option>2026</option>
    <option>2025</option>
    <option>2024</option>
    <option>2023</option>
    <option>2022</option>
    <option>2021</option>
    <option>2020</option>
    <option>2019</option>
    <option>2018</option>
    <option>2017</option>
    <option>2016</option>
    <option>2015</option>
    <option>2014</option>
    <option>2013</option>
    <option>2012</option>
    <option>2011</option>
    <option>2010</option>

    <option>Appearing</option>
    <option>Not Applicable</option>
  </select>
</div>

        <button class="continue-btn">
          Continue
        </button>

      </form>

    </div>

  </div>

</body>
</html>
