<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Career Qualification Page</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:linear-gradient(135deg,#eef6ff,#dff1ff);
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  padding:40px 20px;
}
    /* Background */

    .shape1{
      position:absolute;
      width:450px;
      height:450px;
      background:#0d7be0;
      top:-180px;
      right:-120px;
      border-radius:60px;
      transform:rotate(25deg);
      opacity:0.85;
    }

    .shape2{
      position:absolute;
      width:300px;
      height:300px;
      background:#57ccff;
      bottom:-100px;
      left:-100px;
      border-radius:60px;
      transform:rotate(25deg);
      opacity:0.65;
    }

    /* Card */

    .qualification-card{
  width:100%;
  max-width:1000px;
  background:white;
  border-radius:30px;
  overflow:visible;
  display:flex;
  box-shadow:0 20px 45px rgba(0,0,0,0.12);
  position:relative;
  z-index:5;
  margin-bottom:40px;
}

    /* Left Side */

    .left-section{
      width:45%;
      background:linear-gradient(135deg,#0d7be0,#17b5ff);
      color:white;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:50px 35px;
      text-align:center;
    }

    .left-section h1{
      font-size:42px;
      line-height:1.2;
      margin-bottom:20px;
      font-weight:700;
    }

    .left-section p{
      font-size:17px;
      line-height:1.8;
      max-width:350px;
    }

    /* Right Side */

    .right-section{
      width:55%;
      padding:50px 45px;
    }

    .title{
      font-size:40px;
      font-weight:700;
      color:#1c2b39;
      margin-bottom:10px;
    }

    .subtitle{
      color:#6d7b88;
      line-height:1.8;
      margin-bottom:30px;
      font-size:15px;
    }

    .input-group{
      margin-bottom:22px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:600;
      color:#243547;
    }

    .input-group input,
    .input-group select{
      width:100%;
      padding:15px 16px;
      border:1px solid #d7e4ef;
      border-radius:14px;
      outline:none;
      font-size:15px;
      transition:0.3s;
      background:white;
    }

    .input-group input:focus,
    .input-group select:focus{
      border-color:#1198ff;
      box-shadow:0 0 0 4px rgba(17,152,255,0.12);
    }

    .message{
      margin-top:-10px;
      margin-bottom:20px;
      font-size:14px;
      font-weight:600;
    }

    /* Button */

    .continue-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:16px;
      background:linear-gradient(to right,#0d7be0,#17b5ff);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
      box-shadow:0 10px 22px rgba(13,123,224,0.25);
    }

    .continue-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 28px rgba(13,123,224,0.35);
    }

    /* Responsive */

    @media(max-width:900px){

      body{
        overflow:auto;
      }

      .qualification-card{
        flex-direction:column;
      }

      .left-section,
      .right-section{
        width:100%;
      }

      .right-section{
        padding:40px 25px;
      }

      .left-section{
        padding:40px 25px;
      }

      .left-section h1{
        font-size:34px;
      }

      .title{
        font-size:32px;
      }
      html{
  scroll-behavior:smooth;
}

    }

  </style>
</head>
<body>

  <!-- Background -->

  <div class="shape1"></div>
  <div class="shape2"></div>

  <!-- Main Card -->

  <div class="qualification-card">

    <!-- Left -->

    <div class="left-section">

      <h1>🎓 Find Your Best Career</h1>

      <p>
        Tell us about your qualification and we will help you
        discover the best career opportunities for your future.
      </p>

    </div>

    <!-- Right -->

    <div class="right-section">

      <h2 class="title">Qualification Details</h2>

      <p class="subtitle">
        Select your education qualification to continue and
        explore suitable courses and career paths.
      </p>

      <form>

        <!-- Age -->

        <div class="input-group">

          <label>Age</label>

          <input
            type="number"
            placeholder="Enter your age"
            min="1"
            max="100"
          >

        </div>

        <!-- Qualification -->

        <div class="input-group">

          <label>Select Qualification</label>

          <select id="qualification" onchange="checkQualification()">

            <option value="">Select Qualification</option>

            <option value="10th">10th Pass</option>

            <option value="12th">12th Pass</option>

            <option value="ITI">ITI</option>

            <option value="Diploma">Diploma</option>

            <option value="BA">B.A</option>

            <option value="BSc">B.Sc</option>

            <option value="BCom">B.Com</option>

            <option value="BCA">BCA</option>

            <option value="BBA">BBA</option>

            <option value="BTech">B.Tech</option>

            <option value="BEd">B.Ed</option>

            <option value="MA">M.A</option>

            <option value="MSc">M.Sc</option>

            <option value="MCom">M.Com</option>

            <option value="MCA">MCA</option>

            <option value="MBA">MBA</option>

            <option value="MTech">M.Tech</option>

            <option value="PhD">PhD</option>

            <option value="Other">Other</option>

            <option value="None">None</option>

          </select>

        </div>

        <!-- Education Board -->

        <div class="input-group">

          <label>Select Education Board</label>

          <select id="boardSelect" onchange="checkBoard()">

            <option value="">Select Board</option>

            <option value="available">
              WBBSE - West Bengal Board of Secondary Education
            </option>

            <option value="available">
              WBCHSE - West Bengal Council of Higher Secondary Education
            </option>

            <option value="not">
              CBSE - Central Board of Secondary Education
            </option>

            <option value="not">
              ICSE - Indian Certificate of Secondary Education
            </option>

            <option value="not">
              BSEB - Bihar School Examination Board
            </option>

            <option value="not">
              UPMSP - Uttar Pradesh Board
            </option>

            <option value="not">
              RBSE - Rajasthan Board
            </option>

            <option value="not">
              MSBSHSE - Maharashtra Board
            </option>

            <option value="not">
              Karnataka Board
            </option>

            <option value="not">
              Tamil Nadu Board
            </option>

          </select>

        </div>

        <!-- Board Message -->

        <p id="boardMessage" class="message"></p>

        <!-- Stream -->

        <div class="input-group">

          <label>Select Stream / Subject</label>

          <select id="stream">

            <option value="">Select Stream</option>

            <option>Science</option>

            <option>Commerce</option>

            <option>Arts</option>

            <option>Computer Science</option>

            <option>Engineering</option>

            <option>General</option>

            <option>Other</option>

          </select>

        </div>

        <!-- Stream Message -->

        <p id="streamMessage" class="message"></p>

        <!-- Year -->

        <div class="input-group">

          <label>Qualifying Year</label>

          <select>

            <option>Select Year</option>

            <option>2026</option>
            <option>2025</option>
            <option>2024</option>
            <option>2023</option>
            <option>2022</option>
            <option>2021</option>
            <option>2020</option>
            <option>2019</option>
            <option>2018</option>
            <option>2017</option>
            <option>2016</option>
            <option>2015</option>

            <option>Appearing</option>

          </select>

        </div>

        <!-- Button -->
<button type="button" class="continue-btn"
        onclick="window.location.href='Homepage2.html'">
    Continue
</button>

      </form>

    </div>

  </div>

  <script>

    function checkBoard(){

      const board =
        document.getElementById("boardSelect").value;

      const msg =
        document.getElementById("boardMessage");

      if(board === "available"){

        msg.innerHTML =
          "✅ Available for West Bengal Board";

        msg.style.color = "green";

      }

      else if(board === "not"){

        msg.innerHTML =
          "❌ This board is not available now";

        msg.style.color = "red";

      }

      else{

        msg.innerHTML = "";

      }

    }

    function checkQualification(){

      const qualification =
        document.getElementById("qualification").value;

      const stream =
        document.getElementById("stream");

      const msg =
        document.getElementById("streamMessage");

      if(qualification === "10th"){

        stream.disabled = true;

        stream.style.background = "#eeeeee";

        msg.innerHTML =
          "✅ No stream required for 10th students";

        msg.style.color = "green";

      }

      else{

        stream.disabled = false;

        stream.style.background = "#ffffff";

        msg.innerHTML = "";

      }

    }

  </script>

</body>
</html>
