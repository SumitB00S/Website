<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Career Registration Page</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#eef6fc;
      min-height:100vh;
      overflow-x:hidden;
    }

    .container{
      width:100%;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px 20px;
      position:relative;
      overflow:hidden;
    }

    /* Background Shapes */

    .shape1{
      position:absolute;
      width:500px;
      height:500px;
      background:#0c7cd5;
      top:-200px;
      right:-150px;
      transform:rotate(25deg);
      border-radius:60px;
      opacity:0.9;
    }

    .shape2{
      position:absolute;
      width:350px;
      height:350px;
      background:#4ec7ff;
      bottom:-120px;
      left:-120px;
      transform:rotate(25deg);
      border-radius:60px;
      opacity:0.7;
    }

    /* Main Card */

    .register-card{
      width:100%;
      max-width:1150px;
      background:#fff;
      border-radius:30px;
      overflow:hidden;
      display:flex;
      box-shadow:0 20px 40px rgba(0,0,0,0.12);
      position:relative;
      z-index:5;
    }

    /* Left Section */

    .left-section{
      width:45%;
      background:linear-gradient(135deg,#0d7be0,#1bb9ff);
      padding:60px 40px;
      color:#fff;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;
    }

    .left-section h1{
      font-size:42px;
      margin-bottom:20px;
      line-height:1.2;
    }

    .left-section p{
      font-size:16px;
      line-height:1.8;
      max-width:400px;
      margin-bottom:30px;
    }

    .left-section img{
      width:100%;
      max-width:380px;
      animation:float 4s ease-in-out infinite;
    }

    @keyframes float{
      0%{transform:translateY(0px);}
      50%{transform:translateY(-15px);}
      100%{transform:translateY(0px);}
    }

    /* Right Section */

    .right-section{
      width:55%;
      padding:50px 45px;
    }

    .form-title{
      font-size:38px;
      color:#1d2b38;
      margin-bottom:10px;
      font-weight:700;
    }

    .form-subtitle{
      color:#6d7b88;
      margin-bottom:35px;
      font-size:15px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .input-group{
      display:flex;
      flex-direction:column;
    }

    .input-group.full{
      grid-column:1/3;
    }

    .input-group label{
      margin-bottom:8px;
      font-size:14px;
      font-weight:600;
      color:#243547;
    }

    .input-group input,
    .input-group select,
    .input-group textarea{
      padding:14px 16px;
      border:1px solid #d7e4ef;
      border-radius:12px;
      outline:none;
      font-size:15px;
      transition:0.3s;
    }

    .input-group textarea{
      resize:none;
      height:90px;
    }

    .input-group input:focus,
    .input-group select:focus,
    .input-group textarea:focus{
      border-color:#1198ff;
      box-shadow:0 0 0 4px rgba(17,152,255,0.12);
    }

    .gender-box{
      display:flex;
      align-items:center;
      gap:15px;
      padding-top:10px;
    }

    .gender-box label{
      margin:0;
      font-weight:500;
    }

    .register-btn{
      width:100%;
      margin-top:30px;
      padding:16px;
      border:none;
      border-radius:14px;
      background:linear-gradient(to right,#0d7be0,#17b5ff);
      color:white;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 10px 22px rgba(13,123,224,0.25);
    }

    .register-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 28px rgba(13,123,224,0.35);
    }

    .login-link{
      text-align:center;
      margin-top:20px;
      color:#5f6d7b;
      font-size:15px;
    }

    .login-link a{
      color:#0d7be0;
      text-decoration:none;
      font-weight:600;
    }

    .login-link a:hover{
      text-decoration:underline;
    }

    /* Responsive */

    @media(max-width:950px){

      .register-card{
        flex-direction:column;
      }

      .left-section,
      .right-section{
        width:100%;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .input-group.full{
        grid-column:auto;
      }

    }

    @media(max-width:600px){

      .right-section{
        padding:35px 25px;
      }

      .left-section{
        padding:40px 25px;
      }

      .form-title{
        font-size:30px;
      }

      .left-section h1{
        font-size:32px;
      }

    }

  </style>
</head>
<body>

  <div class="container">

    <div class="shape1"></div>
    <div class="shape2"></div>

    <div class="register-card">

      <!-- Left Section -->

      <div class="left-section">

        <h1>🎓 Create Your Career Account</h1>

        <p>
          Register now and start your journey toward a successful future with
          better career opportunities and education guidance.
        </p>

      </div>

      <!-- Right Section -->

      <div class="right-section">

        <h2 class="form-title">New Registration</h2>
        <p class="form-subtitle">
          Fill all details carefully to create your account.
        </p>

        <form>

          <div class="form-grid">

            <div class="input-group">
              <label>First Name</label>
              <input type="text" placeholder="Enter first name">
            </div>

            <div class="input-group">
              <label>Last Name</label>
              <input type="text" placeholder="Enter last name">
            </div>

            <div class="input-group">
              <label>Email Address</label>
              <input type="email" placeholder="Enter email">
            </div>

            <div class="input-group">
              <label>Mobile Number</label>
              <input type="tel" placeholder="Enter mobile number">
            </div>

            <div class="input-group">
              <label>Date of Birth</label>
              <input type="date">
            </div>


            <div class="input-group full">
              <label>Gender</label>

              <div class="gender-box">
                <input type="radio" name="gender"> <label>Male</label>
                <input type="radio" name="gender"> <label>Female</label>
                <input type="radio" name="gender"> <label>Other</label>
              </div>

            </div>
            
            <div class="input-group">
              <label>Password</label>
              <input type="password" placeholder="Create password">
            </div>

            <div class="input-group">
              <label>Confirm Password</label>
              <input type="password" placeholder="Confirm password">
            </div>

          </div>

          <button type="submit" class="register-btn">
            Create Account
          </button>

        </form>

        <div class="login-link">
          Already have an account?
          <a href="Login.html">Login Here</a>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
