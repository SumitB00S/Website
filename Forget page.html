<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password OTP</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#edf5fc;
      overflow:hidden;
      position:relative;
    }

    /* Background Shapes */

    .shape1{
      position:absolute;
      width:420px;
      height:420px;
      background:#0d7be0;
      top:-180px;
      right:-120px;
      border-radius:70px;
      transform:rotate(25deg);
      opacity:0.95;
    }

    .shape2{
      position:absolute;
      width:320px;
      height:320px;
      background:#67cfff;
      bottom:-130px;
      left:-120px;
      border-radius:70px;
      transform:rotate(25deg);
      opacity:0.8;
    }

    /* Card */

    .forgot-card{
      width:100%;
      max-width:430px;
      background:white;
      padding:45px 35px;
      border-radius:28px;
      position:relative;
      z-index:5;
      box-shadow:0 20px 45px rgba(0,0,0,0.12);
      text-align:center;
    }

    .forgot-card::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:6px;
      border-radius:28px 28px 0 0;
      background:linear-gradient(to right,#0b74d1,#2bbcff);
    }

    /* Icon */

    .icon{
      width:90px;
      height:90px;
      margin:auto;
      margin-bottom:25px;
      border-radius:50%;
      background:linear-gradient(to right,#0b74d1,#2bbcff);
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:40px;
      box-shadow:0 10px 20px rgba(0,119,216,0.25);
    }

    h1{
      font-size:34px;
      color:#1d2c39;
      margin-bottom:12px;
      font-weight:700;
    }

    .subtitle{
      color:#7c8794;
      font-size:15px;
      line-height:1.8;
      margin-bottom:30px;
    }

    /* Input */

    .input-group{
      text-align:left;
      margin-bottom:22px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:600;
      color:#253547;
    }

    .input-group input{
      width:100%;
      padding:16px;
      border:1px solid #d7e4ef;
      border-radius:16px;
      outline:none;
      font-size:15px;
      transition:0.3s;
      box-shadow:0 4px 10px rgba(0,0,0,0.05);
    }

    .input-group input:focus{
      border-color:#16a0ff;
      box-shadow:0 0 0 4px rgba(22,160,255,0.12);
    }

    /* OTP Box */

    .otp-box{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-bottom:25px;
    }

    .otp-box input{
      width:100%;
      height:60px;
      border:1px solid #d7e4ef;
      border-radius:14px;
      text-align:center;
      font-size:22px;
      font-weight:700;
      outline:none;
      transition:0.3s;
    }

    .otp-box input:focus{
      border-color:#16a0ff;
      box-shadow:0 0 0 4px rgba(22,160,255,0.12);
    }

    /* Button */

    .btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:16px;
      background:linear-gradient(to right,#0b74d1,#28b8ff);
      color:white;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 10px 20px rgba(0,119,216,0.25);
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 26px rgba(0,119,216,0.32);
    }

    /* Bottom Link */

    .bottom-text{
      margin-top:22px;
      font-size:15px;
      color:#74808d;
    }

    .bottom-text a{
      color:#0b74d1;
      text-decoration:none;
      font-weight:600;
    }

    .bottom-text a:hover{
      text-decoration:underline;
    }

    /* Responsive */

    @media(max-width:500px){

      .forgot-card{
        margin:20px;
        padding:40px 25px;
      }

      h1{
        font-size:28px;
      }

      .otp-box{
        gap:8px;
      }

      .otp-box input{
        height:55px;
        font-size:20px;
      }

    }

  </style>
</head>
<body>

  <!-- Background -->

  <div class="shape1"></div>
  <div class="shape2"></div>

  <!-- Forgot Password Card -->

  <div class="forgot-card">

    <div class="icon">
      🔒
    </div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
      Enter your registered email address below.
      We will send you an OTP verification code.
    </p>

    <form>

      <!-- Email -->

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">
      </div>

      <!-- Send OTP -->

      <button type="button" class="btn" style="margin-bottom:25px;">
        Send Reset OTP
      </button>

      <!-- OTP -->

      <div class="otp-box">

        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">

      </div>

      <!-- Verify -->

      <button type="submit" class="btn">
        Verify & Continue
      </button>

    </form>

    <div class="bottom-text">
      Remember your password?
      <a href="#">Back to Login</a>
    </div>

  </div>

</body>
</html>
